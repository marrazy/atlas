[project]
name = "api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "arz", email = "fatih.arrazy@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.7",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
api = "api:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
